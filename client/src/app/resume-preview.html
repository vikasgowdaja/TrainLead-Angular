@if (canPreview()) {
  <button class="resume-preview-trigger" type="button" (click)="open()">View resume</button>
  <dialog #previewDialog class="resume-preview-dialog" aria-labelledby="resume-preview-title" (click)="closeOnBackdrop($event)">
    <header class="resume-preview-header">
      <h2 id="resume-preview-title">Resume preview</h2>
      <div><a [href]="url()" target="_blank" rel="noopener noreferrer">Open separately</a><button type="button" aria-label="Close resume preview" (click)="close()"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
    </header>
    <iframe [src]="safePreviewUrl()" title="Resume PDF preview"></iframe>
  </dialog>
} @else {
  <a class="resume-preview-trigger" [href]="url()" target="_blank" rel="noopener noreferrer">Open resume</a>
}
